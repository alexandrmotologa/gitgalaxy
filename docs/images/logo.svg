<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cyan-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.16" />
    </filter>

    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00f5ff" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <!-- Inner Precision Telemetry Ring (Dashed Cyan) -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Orbital Telemetry Coordinates & Marks -->
      <circle cx="0" cy="-355" r="5" fill="#00f5ff" />
      <circle cx="307" cy="-177" r="5" fill="#00f5ff" />
      <circle cx="307" cy="177" r="5" fill="#00f5ff" />
      <circle cx="0" cy="355" r="5" fill="#00f5ff" />
      <circle cx="-307" cy="177" r="5" fill="#00f5ff" />
      <circle cx="-307" cy="-177" r="5" fill="#00f5ff" />

      <!-- ======================================================== -->
      <!-- ASTRAL OWL (STRIX ASTRA) - REFINED MAJESTIC AVIA SILHOUETTE -->
      <!-- ======================================================== -->

      <!-- 1. 100% Watertight Solid Base Silhouette (Zero-Leak Protection) -->
      <path d="
        M 0,-215
        L 60,-225 L 125,-265 L 175,-335 L 160,-240 L 210,-195 L 255,-105 L 265,10 L 245,135 L 195,225 L 125,270 L 55,290 L 0,310
        L -55,290 L -125,270 L -195,225 L -245,135 L -265,10 L -255,-105 L -210,-195 L -160,-240 L -175,-335 L -125,-265 L -60,-225
        Z
      " fill="#070a12" stroke="#070a12" stroke-width="2" />

      <!-- 2. Outer Wing Mantle & Shoulders (Back Layer) -->
      <!-- Left Outer Wing Primary Feathers -->
      <polygon points="-160,-240 -210,-195 -255,-105 -185,-85" fill="#1e293b" />
      <polygon points="-210,-195 -255,-105 -265,10 -195,-15" fill="#0f172a" />
      <polygon points="-255,-105 -265,10 -245,135 -180,65" fill="#1e293b" />
      <polygon points="-265,10 -245,135 -195,225 -150,155" fill="#0f172a" />
      <polygon points="-245,135 -195,225 -125,270 -100,205" fill="#141e2e" />

      <!-- Right Outer Wing (Shadow side) -->
      <polygon points="160,-240 210,-195 255,-105 185,-85" fill="#0f172a" />
      <polygon points="210,-195 255,-105 265,10 195,-15" fill="#090d16" />
      <polygon points="255,-105 265,10 245,135 180,65" fill="#0f172a" />
      <polygon points="265,10 245,135 195,225 150,155" fill="#080c14" />
      <polygon points="245,135 195,225 125,270 100,205" fill="#090d16" />

      <!-- 3. Inner Wing Armor Plates -->
      <!-- Left Inner Wing -->
      <polygon points="-160,-240 -185,-85 -195,-15 -130,-45" fill="#334155" />
      <polygon points="-195,-15 -180,65 -150,155 -100,80" fill="#1e293b" />
      <polygon points="-180,65 -150,155 -100,205 -70,165" fill="#334155" />

      <!-- Right Inner Wing -->
      <polygon points="160,-240 185,-85 195,-15 130,-45" fill="#1e293b" />
      <polygon points="195,-15 180,65 150,155 100,80" fill="#0f172a" />
      <polygon points="180,65 150,155 100,205 70,165" fill="#1e293b" />

      <!-- 4. Prominent Majestic Plumicorn Horns (Stellar Feather Antennas) -->
      <!-- Left Horn (High, Sharp & Lit) -->
      <polygon points="-60,-225 -125,-265 -175,-335 -130,-225" fill="#475569" />
      <polygon points="-125,-265 -175,-335 -160,-240 -130,-225" fill="#334155" />
      <polygon points="-175,-335 -160,-240 -210,-195" fill="#1e293b" />

      <!-- Right Horn (High, Sharp & Shadowed) -->
      <polygon points="60,-225 125,-265 175,-335 130,-225" fill="#1e293b" />
      <polygon points="125,-265 175,-335 160,-240 130,-225" fill="#0f172a" />
      <polygon points="175,-335 160,-240 210,-195" fill="#0b0f19" />

      <!-- 5. Forehead & Crown V-Armor Facets -->
      <polygon points="0,-215 -60,-225 -130,-225 0,-185" fill="#475569" />
      <polygon points="0,-215 60,-225 130,-225 0,-185" fill="#1e293b" />
      <polygon points="0,-185 -130,-225 -135,-155 0,-140" fill="#334155" />
      <polygon points="0,-185 130,-225 135,-155 0,-140" fill="#15202e" />

      <!-- Crown Inset Stellar Diamond (Electric Cyan Pulsar Mark) -->
      <polygon points="0,-200 -35,-175 0,-155 35,-175" fill="url(#cyan-glow)" filter="url(#core-glow)" />
      <circle cx="0" cy="-175" r="3.5" fill="#ffffff" />

      <!-- 6. Facial Disc & Deep Brow Ridges (Mask of the Owl) -->
      <!-- Left Brow Shield -->
      <polygon points="0,-140 -135,-155 -150,-85 -65,-95" fill="#475569" />
      <polygon points="0,-140 -65,-95 0,-85" fill="#64748b" />

      <!-- Right Brow Shield -->
      <polygon points="0,-140 135,-155 150,-85 65,-95" fill="#1e293b" />
      <polygon points="0,-140 65,-95 0,-85" fill="#334155" />

      <!-- Left Cheek Lateral Plates -->
      <polygon points="-150,-85 -185,-85 -130,-45 -90,-50" fill="#334155" />
      <polygon points="-150,-85 -90,-50 -65,-95" fill="#1e293b" />

      <!-- Right Cheek Lateral Plates -->
      <polygon points="150,-85 185,-85 130,-45 90,-50" fill="#1e293b" />
      <polygon points="150,-85 90,-50 65,-95" fill="#0f172a" />

      <!-- 7. PREDATOR ALMOND EYES (Electric Cyan Optics - Intense & Piercing) -->
      <!-- Eye Sockets (Deep Void Obsidian) -->
      <polygon points="-90,-88 -30,-82 -25,-55 -80,-50" fill="#050810" />
      <polygon points="90,-88 30,-82 25,-55 80,-50" fill="#050810" />

      <!-- Left Eye Facet (Cyan Gradient) -->
      <polygon points="-85,-82 -35,-78 -28,-58 -78,-55" fill="url(#cyan-glow)" filter="url(#core-glow)" />
      <!-- Left Pupil (Sharp Vertical Slit) -->
      <polygon points="-60,-80 -54,-80 -51,-59 -57,-59" fill="#04060b" />
      <!-- Left Specular Glint -->
      <circle cx="-64" cy="-73" r="3.5" fill="#ffffff" />

      <!-- Right Eye Facet (Cyan Gradient) -->
      <polygon points="85,-82 35,-78 28,-58 78,-55" fill="url(#cyan-glow)" filter="url(#core-glow)" />
      <!-- Right Pupil (Sharp Vertical Slit) -->
      <polygon points="60,-80 54,-80 51,-59 57,-59" fill="#04060b" />
      <!-- Right Specular Glint -->
      <circle cx="56" cy="-73" r="3.5" fill="#ffffff" />

      <!-- 8. Sleek Sharp Raptor Beak (Clean Titanium Hook) -->
      <polygon points="0,-85 -25,-55 0,0" fill="#94a3b8" />
      <polygon points="0,-85 25,-55 0,0" fill="#475569" />
      <polygon points="0,0 -20,5 0,35" fill="#64748b" />
      <polygon points="0,0 20,5 0,35" fill="#334155" />

      <!-- 9. Throat & Upper Mantle -->
      <polygon points="-25,-55 -90,-50 -60,10 0,0" fill="#334155" />
      <polygon points="25,-55 90,-50 60,10 0,0" fill="#1e293b" />
      <polygon points="-60,10 -130,-45 -100,35 -45,45" fill="#475569" />
      <polygon points="60,10 130,-45 100,35 45,45" fill="#1e293b" />

      <!-- 10. Central Galactic Nexus Core (Stellar Pulsar Reactor) -->
      <!-- Obsidian Reactor Vault -->
      <polygon points="0,35 -65,85 0,135 65,85" fill="#090d16" stroke="#00f5ff" stroke-width="2.5" />
      <polygon points="0,35 -65,85 -45,45" fill="#1e293b" />
      <polygon points="0,35 65,85 45,45" fill="#0f172a" />

      <!-- Four-Pointed Pulsar Star (Galactic Core) -->
      <polygon points="
        0,50
        9,80
        38,85
        9,90
        0,120
        -9,90
        -38,85
        -9,80
      " fill="url(#cyan-core)" filter="url(#core-glow)" />

      <!-- Core Center Star Spark -->
      <circle cx="0" cy="85" r="5" fill="#ffffff" />

      <!-- Energy Traces Leading to Wings -->
      <polygon points="-45,45 -100,35 -80,95 -35,80" fill="#1e293b" />
      <polygon points="45,45 100,35 80,95 35,80" fill="#0f172a" />

      <!-- 11. Abdomen & Tail Feather Plates (Bottom Taper) -->
      <!-- Mid Abdomen Plate -->
      <polygon points="0,135 -65,85 -80,150 0,195" fill="#334155" />
      <polygon points="0,135 65,85 80,150 0,195" fill="#15202e" />

      <!-- Lower Flank Plates -->
      <polygon points="-80,150 -100,80 -80,185 -50,210" fill="#1e293b" />
      <polygon points="80,150 100,80 80,185 50,210" fill="#0f172a" />

      <!-- Lower Keel Chevron -->
      <polygon points="0,195 -50,210 0,265" fill="#475569" />
      <polygon points="0,195 50,210 0,265" fill="#1e293b" />

      <!-- Outer Lower Tail Quills -->
      <polygon points="-50,210 -80,185 -100,205 -65,270 0,265" fill="#1e293b" />
      <polygon points="50,210 80,185 100,205 65,270 0,265" fill="#0b0f19" />

      <!-- Terminal Apex Quill (Ground Anchor) -->
      <polygon points="0,265 -65,270 0,310" fill="#334155" />
      <polygon points="0,265 65,270 0,310" fill="#0f172a" />

      <!-- Cyan Terminal Chevron Flare -->
      <polyline points="-40,275 0,302 40,275" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.85" />

    </g>
  </g>
</svg>